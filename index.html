<html lang="es">
<head>

            --primary-color: #2e7d32;
            --secondary-color: #4caf50;
            --accent-color: #ff9800;
            --dark-color: #333333;
            --light-color: #f9f9f9;
            --whatsapp-color: #25d366;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            color: var(--dark-color);
            background-color: var(--light-color);
            line-height: 1.6;
        }
        header {

            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
        }
        header h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;

        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .card h2 {
            color: var(--primary-color);
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        .card p {

            color: #555;
        }
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));

            text-align: left;
        }
        .feature-item {

            color: var(--primary-color);
            margin-bottom: 0.3rem;

            font-size: 0.9rem;
            margin: 0;
        }

        }
